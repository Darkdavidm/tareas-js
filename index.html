<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tareas App</title>
    <!-- Importamos una fuente moderna y bonita de Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        /* Reseteo básico para que se vea igual en todos los navegadores */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Poppins', sans-serif; 
            /* Un degradado moderno para el fondo */
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Contenedor principal estilo tarjeta flotante */
        .app-container {
            background: rgba(255, 255, 255, 0.98);
            width: 100%;
            max-width: 450px;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
            font-size: 26px;
            font-weight: 600;
        }

        /* Zona donde se escribe la tarea */
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        #taskInput {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s ease;
            font-family: 'Poppins', sans-serif;
        }

        #taskInput:focus {
            outline: none;
            border-color: #667eea; /* Borde de color al hacer clic */
        }

        #addBtn {
            background: #667eea;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.1s;
        }

        #addBtn:hover { background: #5a6fd6; }
        #addBtn:active { transform: scale(0.95); } /* Efecto de hundirse al pulsar */

        /* Estilos para los botones de filtros */
        .filters {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            background: #f4f4f9;
            padding: 6px;
            border-radius: 10px;
        }

        .filters button {
            flex: 1;
            background: transparent;
            border: none;
            padding: 8px 0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            color: #666;
            transition: all 0.3s ease;
        }

        .filters button:hover {
            background: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            color: #667eea;
        }

        /* Lista de tareas */
        #taskList {
            list-style: none;
            max-height: 350px;
            overflow-y: auto; /* Barra de desplazamiento si hay muchas */
            padding-right: 5px;
        }

        /* Decorar la barra de desplazamiento */
        #taskList::-webkit-scrollbar { width: 6px; }
        #taskList::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }

        /* Estilo de cada fila de tarea */
        .task-item { 
            display: flex; 
            align-items: center; 
            padding: 15px; 
            background: white;
            border: 1px solid #f0f0f0;
            border-radius: 10px;
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }

        .task-item:hover {
            transform: translateY(-2px); /* La tarea "flota" al pasar el ratón */
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            border-color: #667eea;
        }

        /* Checkbox moderno */
        .task-item input[type="checkbox"] {
            margin-right: 15px;
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #667eea; 
        }

        .task-item span {
            flex: 1;
            font-size: 15px;
            color: #333;
            transition: color 0.3s;
        }

        /* Estilo cuando la tarea está tachada */
        .completed span { 
            text-decoration: line-through; 
            color: #aaa; 
            font-style: italic;
        }

        /* Botón de eliminar rojo */
        .task-item button {
            background: #ff4757;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.3s;
            opacity: 0.8;
        }

        .task-item button:hover {
            background: #ff6b81;
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <h1>Mis Tareas</h1>
        
        <div class="input-group">
            <input type="text" id="taskInput" placeholder="¿Qué necesitas hacer hoy?">
            <button id="addBtn">Agregar</button>
        </div>

        <div class="filters">
            <button id="btnAll">Todas</button>
            <button id="btnPending">Pendientes</button>
            <button id="btnCompleted">Completadas</button>
        </div>

        <ul id="taskList"></ul>
    </div>

    <!-- El script principal se carga como módulo -->
    <script type="module" src="app.js"></script>
</body>
</html>
